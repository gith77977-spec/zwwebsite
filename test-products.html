<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Product Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #cc0000; margin-bottom: 2rem; }
        .test-section {
            background: #1a1a1a;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 2px solid #333;
        }
        button {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        button:hover { opacity: 0.8; }
        .result { margin-top: 1rem; padding: 1rem; background: #0a0a0a; border-left: 3px solid #cc0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Management Test</h1>
        
        <div class="test-section">
            <h2>Test localStorage Connection</h2>
            <button onclick="testProducts()">Test: Check Stored Products</button>
            <div id="result1" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Add Test Product</h2>
            <button onclick="addTestProduct()">Add: Test Product</button>
            <div id="result2" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Admin Dashboard</h2>
            <a href="admin.html" style="color: #cc0000; text-decoration: none;">
                <button>Open: Admin Dashboard</button>
            </a>
        </div>

        <div class="test-section">
            <h2>Shop Products</h2>
            <a href="products.html" style="color: #cc0000; text-decoration: none;">
                <button>Open: Shop Page</button>
            </a>
        </div>

        <div class="test-section">
            <h2>View All Products in localStorage</h2>
            <button onclick="viewAllProducts()">View: All Products</button>
            <div id="result3" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Clear All Products</h2>
            <button onclick="clearAllProducts()" style="background: #cc0000;">Clear: Reset to Default</button>
            <div id="result4" class="result"></div>
        </div>
    </div>

    <script>
        function testProducts() {
            const products = JSON.parse(localStorage.getItem('zonewear-products')) || [];
            const result = document.getElementById('result1');
            result.innerHTML = `<strong>Products found: ${products.length}</strong><br>
                Products are stored at key: <code>zonewear-products</code><br>
                Status: ${products.length > 0 ? '✓ Working' : '✗ Empty'}`;
        }

        function addTestProduct() {
            const products = JSON.parse(localStorage.getItem('zonewear-products')) || [];
            const testProduct = {
                id: Date.now(),
                name: 'Test Product - Remove Me',
                descAr: 'منتج اختبار - احذفني',
                price: 9999,
                category: 'accessories',
                stock: 10,
                image: 'images/placeholder.png'
            };
            products.push(testProduct);
            localStorage.setItem('zonewear-products', JSON.stringify(products));
            
            const result = document.getElementById('result2');
            result.innerHTML = `<strong>✓ Test product added!</strong><br>
                Total products: ${products.length}<br>
                Product ID: ${testProduct.id}<br>
                <a href="products.html" style="color: #cc0000;">Go to Shop to see it</a>`;
        }

        function viewAllProducts() {
            const products = JSON.parse(localStorage.getItem('zonewear-products')) || [];
            const result = document.getElementById('result3');
            
            if (products.length === 0) {
                result.innerHTML = 'No products stored.';
                return;
            }

            let html = `<strong>Total Products: ${products.length}</strong><br><br>`;
            products.forEach((p, i) => {
                html += `<div style="margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #333;">
                    <strong>${i + 1}. ${p.name}</strong><br>
                    Price: ${p.price} DA<br>
                    Category: ${p.category}<br>
                    Stock: ${p.stock}
                </div>`;
            });
            result.innerHTML = html;
        }

        function clearAllProducts() {
            if (confirm('This will reset to default products. Continue?')) {
                localStorage.removeItem('zonewear-products');
                const result = document.getElementById('result4');
                result.innerHTML = '✓ localStorage cleared. Refresh the page to reload defaults.';
            }
        }

        // Auto-run test on load
        window.addEventListener('load', () => {
            testProducts();
        });
    </script>
</body>
</html>
