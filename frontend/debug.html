<!DOCTYPE html>
<html>
<head>
    <title>Debug Products</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
        .section { margin-bottom: 20px; border: 1px solid #0f0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Product Debug Info</h1>
    
    <div class="section">
        <h2>localStorage['zonewear-products']</h2>
        <pre id="products-data">Loading...</pre>
    </div>
    
    <div class="section">
        <h2>localStorage['zonewear-cart']</h2>
        <pre id="cart-data">Loading...</pre>
    </div>
    
    <div class="section">
        <h2>localStorage['zonewear-orders']</h2>
        <pre id="orders-data">Loading...</pre>
    </div>

    <script>
        document.getElementById('products-data').textContent = JSON.stringify(
            JSON.parse(localStorage.getItem('zonewear-products') || '[]'),
            null,
            2
        );
        
        document.getElementById('cart-data').textContent = JSON.stringify(
            JSON.parse(localStorage.getItem('zonewear-cart') || '[]'),
            null,
            2
        );
        
        document.getElementById('orders-data').textContent = JSON.stringify(
            JSON.parse(localStorage.getItem('zonewear-orders') || '[]'),
            null,
            2
        );
    </script>
</body>
</html>
